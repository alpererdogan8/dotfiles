# =============================================================================
# DIRECTORY
# =============================================================================

[directory]
style = "bold #d3c6aa"
format = "[$path]($style) "
truncation_length = 3
# truncation_symbol = "../"
truncate_to_repo = false
home_symbol = "~"
read_only = " "
read_only_style = "bold #e67e80"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Videos" = ""
"Desktop" = ""
".config" = ""
"workspace" = ""
"projects" = ""

# =============================================================================
# GIT - Image 2 Style: on  main [!]
# =============================================================================

[git_branch]
symbol = " "
style = "bold #a7c080"
format = "[on](bold #7a8478) [$symbol$branch]($style)"
truncation_length = 20

[git_status]
style = "bold #e67e80"
format = '([$all_status$ahead_behind]($style))'
conflicted = "[!]"
ahead = "[⇡${count}]"
behind = "[⇣${count}]"
diverged = "[⇡${ahead_count}⇣${behind_count}]"
up_to_date = ""
untracked = "[?${count}]"
stashed = ""
modified = "[*${count}]"
staged = "[+${count}]"
renamed = "[»${count}]"
deleted = "[✘${count}]"

# =============================================================================
# LANGUAGES - Image 2 Style: via  v22.22.0
# =============================================================================

[nodejs]
symbol = ""
style = "bold #a7c080"
format = "[via](bold #7a8478) [$symbol]($style)[ v$version](bold #d3c6aa) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx", "mts", "cts"]
detect_files = ["package.json", ".node-version", ".nvmrc", "yarn.lock", "package-lock.json"]
detect_folders = ["node_modules"]

[python]
symbol = ""
