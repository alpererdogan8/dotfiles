add_newline = true

[battery]
disabled = true

[package]
disabled = false

# =============================================================================
# FORMAT - Clean Minimal Style
# =============================================================================
format = """$directory$git_branch$git_status
$time$character"""

# =============================================================================
# PROMPT CHARACTER - 12 Alternatives with Everforest Colors
# =============================================================================

[character]
# STYLE 1: Simple > (Default) - Everforest Green/Red
success_symbol = "[>](bold #a7c080)"
error_symbol = "[>](bold #e67e80)"
vimcmd_symbol = "[<](bold #a7c080)"

# STYLE 2: Chevron ❯
# success_symbol = "[❯](bold #a7c080)"
# error_symbol = "[❯](bold #e67e80)"
# vimcmd_symbol = "[❮](bold #a7c080)"

# STYLE 3: Arrow ➜
# success_symbol = "[➜](bold #a7c080)"
# error_symbol = "[➜](bold #e67e80)"
# vimcmd_symbol = "[➜](bold #dbbc7f)"

# STYLE 4: Chevron (Nerd Font) 
# success_symbol = "[](bold #a7c080)"
# error_symbol = "[](bold #e67e80)"
# vimcmd_symbol = "[](bold #a7c080)"

# STYLE 5: Diamond ◆
# success_symbol = "[◆](bold #83c092)"
# error_symbol = "[◆](bold #e67e80)"
# vimcmd_symbol = "[◇](bold #83c092)"

# STYLE 6: Powerline 
# success_symbol = "[](bold #a7c080)"
# error_symbol = "[](bold #e67e80)"
# vimcmd_symbol = "[](bold #a7c080)"

# STYLE 7: Bullet •
# success_symbol = "[•](bold #a7c080)"
# error_symbol = "[•](bold #e67e80)"
# vimcmd_symbol = "[◦](bold #a7c080)"

# STYLE 8: Star ✦
# success_symbol = "[✦](bold #dbbc7f)"
# error_symbol = "[✦](bold #e67e80)"
# vimcmd_symbol = "[✧](bold #dbbc7f)"

# STYLE 9: Small Chevron ›
# success_symbol = "[›](bold #a7c080)"
# error_symbol = "[›](bold #e67e80)"
# vimcmd_symbol = "[‹](bold #a7c080)"

# STYLE 10: Sword/Shield/Skull - Everforest
# SET 1: Nerd Font
# success_symbol = "[󰓥](bold #7fbbb3)"
# error_symbol = "[󰮭](bold #e67e80)"
# vimcmd_symbol = "[󰧶](bold #7fbbb3)"

# SET 2: Standard Unicode
# success_symbol = "[🗡](bold #7fbbb3)"
# error_symbol = "[💀](bold #e67e80)"
# vimcmd_symbol = "[🛡](bold #7fbbb3)"

# SET 3: Crossed Swords
# success_symbol = "[⚔](bold #7fbbb3)"
# error_symbol = "[☠](bold #e67e80)"
# vimcmd_symbol = "[🛡](bold #7fbbb3)"

# SET 4: Fantasy
# success_symbol = "[󱐋](bold #7fbbb3)"
# error_symbol = "[👻](bold #e67e80)"
# vimcmd_symbol = "[󱡟](bold #7fbbb3)"

# SET 5: Minimal
# success_symbol = "[⌖](bold #7fbbb3)"
# error_symbol = "[⚰](bold #e67e80)"
# vimcmd_symbol = "[⛨](bold #7fbbb3)"

# STYLE 11: Double Arrow »
# success_symbol = "[»](bold #a7c080)"
# error_symbol = "[»](bold #e67e80)"
# vimcmd_symbol = "[«](bold #a7c080)"

# STYLE 12: Pointer →
# success_symbol = "[→](bold #a7c080)"
# error_symbol = "[→](bold #e67e80)"
# vimcmd_symbol = "[←](bold #a7c080)"

# =============================================================================
# DIRECTORY - Minimal & Colorful (No icons in names)
# =============================================================================


# [directory]
# style = "bold #d3c6aa"
# format = "[$path]($style) "
# truncation_length = 2
# truncation_symbol = "…/"
# truncate_to_repo = false
# home_symbol = "~"
# read_only = " "
# read_only_style = "bold #e67e80"


# # Empty substitutions - no icons in directory names
# [directory.substitutions]




# =============================================================================
# GIT BRANCH - Clean with icon
# =============================================================================

[git_branch]
symbol = ""
style = "bold #a7c080"
format = "[$branch]($style)"
truncation_length = 20

[git_commit]
commit_hash_length = 7
style = "bold #83c092"
format = "[$hash]($style)"
only_detached = true

# =============================================================================
# GIT STATUS - Clean with icons when needed
# =============================================================================

[git_status]
style = "bold #e67e80"
format = '[$all_status$ahead_behind]($style) '
conflicted = " conflict"
ahead = " +${count}"
behind = " -${count}"
diverged = " ±${ahead_count}"
up_to_date = ""
untracked = " ?${count}"
stashed = ""
modified = " ~${count}"
staged = " +${count}"
renamed = " »${count}"
deleted = " ✘${count}"

