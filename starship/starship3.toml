# =============================================================================

[python]
symbol = ""
style = "bold #dbbc7f"
format = "[$symbol]($style) "
detect_extensions = ["py", "pyw", "ipynb"]
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile"]
detect_folders = [".venv", "venv"]

