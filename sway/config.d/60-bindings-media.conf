# Override system media bindings with SwayOSD
# Replaces /usr/share/sway/config.d/60-bindings-media.conf
#
# Required: this file MUST exist, otherwise the stock bindings in
# /usr/share/sway/config.d/60-bindings-media.conf win (they are loaded
# first) and the keys work but show no OSD.
#
# NOTE: swayosd-client --playerctl accepts "prev", NOT playerctl's
# "previous". It exits 0 on a bad value, so a typo fails silently.

# Allow Play and Stop bindings even if the screen is locked
bindsym --locked {
    XF86AudioPlay       exec swayosd-client --playerctl play-pause
    XF86AudioStop       exec swayosd-client --playerctl stop
}

bindsym {
    XF86AudioNext       exec swayosd-client --playerctl next
    XF86AudioPause      exec swayosd-client --playerctl pause
    XF86AudioPrev       exec swayosd-client --playerctl prev
}

# No swayosd equivalent for seeking — keep plain playerctl so these
# keys don't die with the rest of the file.
bindsym {
    XF86AudioForward    exec playerctl position +10
    XF86AudioRewind     exec playerctl position -10
}