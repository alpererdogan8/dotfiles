# Media keys routed through SwayOSD. This file must exist: the stock
# /usr/share/sway/config.d/60-bindings-media.conf is loaded first and would
# otherwise win, leaving the keys working but with no OSD.
#
# swayosd-client --playerctl wants "prev", not playerctl's "previous". It
# exits 0 on a bad value, so a typo fails silently.

# Play and Stop also work while the screen is locked
bindsym --locked {
    XF86AudioPlay       exec swayosd-client --playerctl play-pause
    XF86AudioStop       exec swayosd-client --playerctl stop
}

bindsym {
    XF86AudioNext       exec swayosd-client --playerctl next
    XF86AudioPause      exec swayosd-client --playerctl pause
    XF86AudioPrev       exec swayosd-client --playerctl prev
}

# No SwayOSD equivalent for seeking, so these stay on plain playerctl
bindsym {
    XF86AudioForward    exec playerctl position +10
    XF86AudioRewind     exec playerctl position -10
}