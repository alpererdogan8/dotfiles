# Floating window rules for waybar on-click terminals
# These rules match the window titles set by waybar's on-click commands
# (cpu → btop, pulseaudio → wiremix, bluetooth → bluetui, network → impala)
# and make them float, centered, with a fixed size.

# btop-float: launched by CPU and Pulseaudio waybar modules
for_window [title="^btop-float$"] {
    floating enable
    # resize set width 1300 px height 700 px
    resize set 94 ppt 92 ppt
    move position center
}

# bluetui-float: launched by Bluetooth waybar module
for_window [title="^bluetui-float$"] {
    floating enable
    # resize set width 1300 px height 700 px
    resize set 94 ppt 92 ppt
    move position center
}

# impala-float: launched by Network waybar module
for_window [title="^impala-float$"] {
    floating enable
    # resize set width 1300 px height 700 px
    resize set 94 ppt 92 ppt
    move position center
}
