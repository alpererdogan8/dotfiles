# Make waybar's on-click terminals float, centered and fixed size. The titles
# come from the `--title=` flags in waybar's on-click commands.

# btop-float: CPU module
for_window [title="^btop-float$"] {
    floating enable
    # resize set width 1300 px height 700 px
    resize set 94 ppt 92 ppt
    move position center
}

