# Override Fedora's default bar config (bar { swaybar_command waybar })
# Waybar is dynamically managed: uses config.jsonc (dual) when HDMI-A-1 is connected,
# config-laptop.jsonc (all 1-10 on eDP) when disconnected.

exec bash -c '\
    W=$HOME/.config/waybar; \
    sw(){ \
        pkill -x waybar 2>/dev/null; \
        sleep 0.3; \
        if swaymsg -t get_outputs 2>/dev/null | grep -q HDMI-A-1; then \
            waybar -c "$W/config.jsonc" -s "$W/style.css" & \
        else \
            waybar -c "$W/config-laptop.jsonc" -s "$W/style.css" & \
        fi; \
    }; \
    sw; \
    swaymsg -t subscribe -m "[\"output\"]" 2>/dev/null | while read -r _; do \
        sleep 0.8; \
        sw; \
    done'
