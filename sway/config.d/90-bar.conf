# config.jsonc is a JSON array with two output-aware bars:
#   Bar 1 → HDMI-A-1 (workspaces 1-5, auto-hidden when HDMI is absent)
#   Bar 2 → eDP-1    (workspaces 6-10 dual / 1-10 laptop-only)
# Waybar silently drops bars for disconnected outputs, so a single launch
# command handles both dual-monitor and laptop-only mode automatically.

exec uwsm app -- waybar -c "$HOME/.config/waybar/config.jsonc" -s "$HOME/.config/waybar/style.css"
