# Override system volume bindings with SwayOSD
# Replaces /usr/share/sway/config.d/60-bindings-volume.conf

# Volume raise (unmute + raise)
bindsym --locked XF86AudioRaiseVolume exec swayosd-client --output-volume raise --max-volume 100
# Volume lower (unmute + lower)
bindsym --locked XF86AudioLowerVolume exec swayosd-client --output-volume lower --max-volume 100
# Volume mute toggle
bindsym --locked XF86AudioMute exec swayosd-client --output-volume mute-toggle
# Mic mute toggle
bindsym --locked XF86AudioMicMute exec swayosd-client --input-volume mute-toggle
