# packages.conf — how each top-level directory in this repository is deployed.
#
# Sourced by install.sh and by local-bin/.local/bin/stow-status.sh, so the
# installer and the link checker cannot disagree about what exists.
#
# The rule is a convention rather than a list: a top-level directory in this
# repository is a stow package and lands in ~/.config/<name>. Creating a new
# directory is therefore the whole of the work — there is nothing here to edit,
# and the package shows up in `./install.sh --list` on its own. That is
# deliberate: a package that has to be registered before it can be installed is
# also a package that silently never gets installed.
#
# Directories whose name starts with a dot are not packages. Stow skips them
# unless it is run with --dotfiles, so a target for one could never be honoured.
#
# OVERRIDE_TARGET holds the packages that do not follow the convention, because
# their contents mirror a path that is not ~/.config/<name>:
#
#   starship   starship.toml is read from ~/.config/starship.toml, so the package
#              deploys its files straight into ~/.config
#   bash/git/  these mirror paths below $HOME itself (.bashrc, .gitconfig,
#   zsh/vscode .zshenv, .vscode/...), not below a directory of their own
#   local-bin  likewise: .local/bin/*
#   ly         the display manager is a system package at /etc/ly
#
# SUDO_PACKAGES lists the packages installed with sudo, which is the other half
# of what makes a package different from the convention.

declare -A OVERRIDE_TARGET=(
  [starship]="$HOME/.config"
  [bash]="$HOME"
  [git]="$HOME"
  [zsh]="$HOME"
  [vscode]="$HOME"
  ['local-bin']="$HOME"
  [ly]="/etc/ly"
)

SUDO_PACKAGES=(ly)

# Where a package's files go. $1 is the package name.
package_target() {
  local name="$1"
  if [[ -n "${OVERRIDE_TARGET[$name]+x}" ]]; then
    printf '%s' "${OVERRIDE_TARGET[$name]}"
  else
    printf '%s' "$HOME/.config/$name"
  fi
}

# Every package name, one per line, sorted. Discovery rather than a list, so the
# repository and the installer cannot fall out of step.
# $1 is the repository root; defaults to the directory holding this file.
package_list() {
  local root="${1:-${DOTFILES_DIR:?}}" dir
  for dir in "$root"/*/; do
    dir="${dir%/}"
    dir="$(basename "$dir")"
    # "*" does not match dotfiles, but be explicit rather than rely on it.
    [[ "$dir" == .* ]] && continue
    printf '%s\n' "$dir"
  done | sort
}

# Every package name with its target, as "name<TAB>target" lines.
package_pairs() {
  local pkg
  while IFS= read -r pkg; do
    [[ -n "$pkg" ]] || continue
    printf '%s\t%s\n' "$pkg" "$(package_target "$pkg")"
  done < <(package_list "${1:-${DOTFILES_DIR:?}}")
}