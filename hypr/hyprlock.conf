# Hyprlock Configuration - Custom Lock Screen
# Blurred screenshot background with modern UI
# Responsive layout using percentage-based positioning

# ============================================
# BACKGROUND - Blurred Screenshot
# ============================================
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# ============================================
# LOCK ICON - Top of screen (5% from top)
# ============================================
label {
    monitor =
    text = 󰌾
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -5%
    halign = center
    valign = top
}

# ============================================
# TIME - Below lock icon
# ============================================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 70
    font_family = SF Pro Display, Inter, sans-serif
    shadow_passes = 0
    shadow_size = 0
    shadow_color = rgba(0, 0, 0, 0)
    position = 0, -10%
    halign = center
    valign = top
}

# ============================================
# DATE - Below time
# ============================================
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = SF Pro Display, Inter, sans-serif
    shadow_passes = 0
    shadow_size = 0
    shadow_color = rgba(0, 0, 0, 0)
    position = 0, -25%
    halign = center
    valign = top
}

# ============================================
# PROFILE IMAGE - Center area
# ============================================
image {
    monitor =
    path = $HOME/.config/hypr/profilepicture.jpg
    size = 90
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.25)
    shadow_passes = 0
    shadow_size = 0
    shadow_color = rgba(0, 0, 0, 0)
    position = 0, 2.5%
    halign = center
    valign = center
}

# ============================================
# GREETING - Below profile
# ============================================
label {
    monitor =
    text = Hi, $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 14
    font_family = SF Pro Display, Inter, sans-serif
    shadow_passes = 0
    shadow_size = 0
    shadow_color = rgba(0, 0, 0, 0)
    position = 0, -7%
    halign = center
    valign = center
}

# ============================================
# PASSWORD INPUT FIELD - Below greeting
# ============================================
input-field {
    monitor =
    size = 220, 40
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.0)
    inner_color = rgba(0, 0, 0, 0.17)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##ffffff80">Enter Pass</span>
    hide_input = false
    rounding = 8
    check_color = rgba(8, 255, 8, 0)
    fail_color = rgba(37, 0, 0, 0.8)
    fail_text = <span foreground="##ff6666">Wrong Password</span>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgba(255, 180, 0, 0.8)
    position = 0, -12%
    halign = center
    valign = center
}


# ============================================
# MEDIA PLAYER CARD (Optimized - Fixed Layout)
# ============================================

# 1. Arka Plan Kutusu (Sabit Piksel)
shape {
    monitor =
    size = 350, 100
    color = rgba(0, 0, 0, 0.5)
    rounding = 20
    blur_passes = 3
    blur_size = 5
    
    position = 0, 50
    halign = center
    valign = bottom
    zindex = 1
}

# 2. Albüm Kapağı (Optimize Edilmiş - magick komutu ile)
image {
    monitor =
    path = /tmp/hyprlock_album_art.png
    size = 80
    rounding = 15
    border_size = 0
    shadow_passes = 2
    shadow_size = 3
    
    reload_time = 2
    reload_cmd = status=$(playerctl status 2>/dev/null | head -n 1); if [ "$status" = "Playing" ] || [ "$status" = "Paused" ]; then albumart=$(playerctl metadata mpris:artUrl 2>/dev/null | sed 's|file://||'); if [ -n "$albumart" ]; then if echo "$albumart" | grep -q "^http"; then curl -s -o /tmp/hyprlock_temp.png "$albumart" 2>/dev/null && magick /tmp/hyprlock_temp.png -resize 80x80^ -gravity center -extent 80x80 /tmp/hyprlock_album_art.png 2>/dev/null; else magick "$albumart" -resize 80x80^ -gravity center -extent 80x80 /tmp/hyprlock_album_art.png 2>/dev/null; fi; fi; echo /tmp/hyprlock_album_art.png; else rm -f /tmp/hyprlock_album_art.png 2>/dev/null; echo ''; fi
    
    position = -125, 60
    halign = center
    valign = bottom
    zindex = 2
}

# 3. Şarkı Adı (Title)
label {
    monitor =
    text = cmd[update:2000] status=$(playerctl status 2>/dev/null | head -n 1); if [ "$status" = "Playing" ] || [ "$status" = "Paused" ]; then playerctl metadata title 2>/dev/null | cut -c1-22; else echo ""; fi
    color = rgba(255, 255, 255, 1.0)
    font_size = 14
    font_family = SF Pro Display, Inter, Bold
    
    position = 40, 105
    halign = center
    valign = bottom
    zindex = 2
}

# 4. Sanatçı (Artist)
label {
    monitor =
    text = cmd[update:2000] status=$(playerctl status 2>/dev/null | head -n 1); if [ "$status" = "Playing" ] || [ "$status" = "Paused" ]; then playerctl metadata artist 2>/dev/null | cut -c1-25; else echo ""; fi
    color = rgba(255, 255, 255, 0.75)
    font_size = 11
    font_family = SF Pro Display, Inter, sans-serif
    
    position = 40, 85
    halign = center
    valign = bottom
    zindex = 2
}

# 5. Süre / Pozisyon (Time)
label {
    monitor =
    text = cmd[update:2000] status=$(playerctl status 2>/dev/null | head -n 1); if [ "$status" = "Playing" ] || [ "$status" = "Paused" ]; then pos=$(playerctl position 2>/dev/null); len=$(playerctl metadata mpris:length 2>/dev/null); if [ -n "$pos" ] && [ -n "$len" ]; then printf "%d:%02d / %d:%02d" $((${pos%.*}/60)) $((${pos%.*}%60)) $((len/1000000/60)) $((len/1000000%60)); fi; else echo ""; fi
    color = rgba(255, 255, 255, 0.5)
    font_size = 10
    font_family = JetBrainsMono Nerd Font, monospace
    
    position = 40, 65
    halign = center
    valign = bottom
    zindex = 2
}
