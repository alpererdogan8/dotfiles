general {
    lock_cmd         = pidof hyprlock || hyprlock    # lock command
    before_sleep_cmd = loginctl lock-session         # lock before sleep
    after_sleep_cmd  = hyprctl dispatch dpms on      # re-enable display on wake
}

# STEP 1: Turn off display (at 5 minutes)
listener {
    timeout   = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# STEP 2: Lock session (at 10 minutes)
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# STEP 3: Suspend (at 1 hour)
listener {
    timeout    = 3600
    on-timeout = systemctl suspend
}
