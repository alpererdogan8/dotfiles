[manager]
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [
    { run = 'nvim "$@"', block = true }
]

[plugin]

[status]
separator_open = ""
separator_close = ""

[indicator]
padding = { open = "", close = "" }
