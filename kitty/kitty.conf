# =============================================================================
# kitty.conf — Main entry point
#
# Each section is split into its own file for easy theming.
# To switch themes, change the include line below to point to another file
# inside the themes/ directory.
# =============================================================================

# --- Font & typography ---
include font.conf

# --- Window & behaviour ---
include window.conf

# --- Color theme ---
# Available themes (uncomment one):
include themes/hybrid.conf
