# ==========================================
# TMUX CONFIGURATION BACKUP (tmux-yedek.conf)
# Backup Date: March 20, 2026
# ==========================================

# ------------------------------------------
# SOURCE: tmux.conf (Main Configuration File)
# ------------------------------------------
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keys.conf


# ------------------------------------------
# SOURCE: options.conf (System Options)
# ------------------------------------------

# Theme & Appearance
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# System Features
set -g allow-passthrough on
set -g mouse on
set -g history-limit 10000
set -g default-terminal "xterm-256color"

# Terminal Compatibility
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ',xterm*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',xterm*:Setulc=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%d m'
set -as terminal-features ",xterm-ghostty:hyperlinks"

# Timing & Indexing
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# ------------------------------------------
# SOURCE: keys.conf (Keyboard Shortcuts)
# ------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"


# ------------------------------------------
# SOURCE: aliases.zsh (Zsh Aliases)
# ------------------------------------------
# [EMPTY - No content]
