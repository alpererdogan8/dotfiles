set -g @everforest_bg_dim '#1e2326'
set -g @everforest_bg0 '#272e33'
set -g @everforest_bg1 '#2e383c'
set -g @everforest_bg2 '#374145'
set -g @everforest_bg3 '#414b50'
set -g @everforest_bg4 '#495156'
set -g @everforest_bg5 '#4f5b58'
set -g @everforest_bg_visual '#4c3743'
set -g @everforest_bg_red '#493b40'
set -g @everforest_bg_green '#3c4841'
set -g @everforest_bg_blue '#384b55'
set -g @everforest_bg_yellow '#45443c'

set -g @everforest_fg '#d3c6aa'
set -g @everforest_red '#e67e80'
set -g @everforest_orange '#e69875'
set -g @everforest_yellow '#dbbc7f'
set -g @everforest_green '#a7c080'
set -g @everforest_aqua '#83c092'
set -g @everforest_blue '#7fbbb3'
set -g @everforest_purple '#d699b6'
set -g @everforest_grey0 '#7a8478'
set -g @everforest_grey1 '#859289'
set -g @everforest_grey2 '#9da9a0'
set -g @everforest_statusline1 '#a7c080'
set -g @everforest_statusline2 '#d3c6aa'
set -g @everforest_statusline3 '#e67e80'

set-option -g status "on"
set -g status-interval 2

set-option -g status-fg '#d3c6aa'
set-option -g status-bg '#2d353b'

set-option -g mode-style fg='#{@everforest_purple}',bg='#{@everforest_bg_red}'

set-option -g status-style fg='#{@everforest_fg}',bg='#{@everforest_bg_dim}',default

set-window-option -g window-status-style fg='#{@everforest_bg5}',bg='#{@everforest_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@everforest_bg1},fg=#{@everforest_bg3}'
set-window-option -g window-status-current-style fg='#{@everforest_fg}',bg='#{@everforest_bg_green}'

set-option -g pane-border-style fg='#{@everforest_bg1}'
set-option -g pane-active-border-style 'fg=#{@everforest_blue}'

set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@everforest_bg_dim},bg=#{@everforest_green},bold] #S #[fg=#{@everforest_fg},bg=#{@everforest_bg2},bold] #(whoami) '

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@everforest_fg},bg=#{@everforest_bg2}] %Y-%m-%d | %H:%M #[fg=#{@everforest_bg_dim},bg=#{@everforest_aqua},bold] #h '

set -g window-status-separator ''
set -g window-status-format "#[fg=#{@everforest_grey0},bg=#{@everforest_bg0}] #I: #W "
set -g window-status-current-format "#[fg=#{@everforest_fg},bg=#{@everforest_bg_green},bold] #I: #W "
