# ── Hybrid Theme for tmux ────────────────────────────────────────────────────
# Ghostty Hybrid palette → tmux adaptation
# Structure mirrors sunset-drive.conf, colors are from /usr/share/ghostty/themes/Hybrid
#
# bg        = #161719   foreground  = #b7bcba
# cyan      = #7fbfb4   blue        = #6e90b0
# black-dim = #2a2e33   bright-blk  = #434548
# yellow    = #e4b55e   red         = #b84d51
# ─────────────────────────────────────────────────────────────────────────────

set -g status-interval 3

set -g status on
set -g status-position top
set -g status-justify left

set -g status-style "bg=#161719,fg=#b7bcba"

# Left: session name — cyan accent block + arrow fade
set -g status-left         "#[bg=#7fbfb4,fg=#161719,bold] #S #[bg=#161719,fg=#7fbfb4,nobold]"
set -g status-left-length  30

# Right: time | date block in muted grey
set -g status-right-length 50
set -g status-right "#[fg=#434548]#[bg=#434548,fg=#7fbfb4] %H:%M #[bg=#434548,fg=#b7bcba]│#[fg=#b7bcba] %d/%m/%Y #[bg=#434548,fg=#161719]"

# Inactive windows: muted separator + dim index + window name
set -g window-status-format         "#[bg=#161719,fg=#434548]▎#[fg=#b5b9b6] #I #[fg=#7fbfb4]#{=10:window_name}  "
set -g window-status-style          "bg=#161719"
set -g window-status-separator      ""

# Active window: cyan separator + highlighted
set -g window-status-current-format "#[bg=#2a2e33,fg=#7fbfb4]▎#[fg=#7fbfb4] #I #[fg=#b7bcba]#{=10:window_name}  "
set -g window-status-current-style  "bg=#2a2e33"

# Activity / bell alerts
set -g window-status-activity-style "bg=#161719,fg=#e4b55e"
set -g window-status-bell-style     "bg=#161719,fg=#b84d51,bold"

# Pane borders
set -g pane-border-style        "fg=#434548"
set -g pane-active-border-style "fg=#6e90b0"

# Command / message bar
set -g message-style         "bg=#434548,fg=#7fbfb4,bold"
set -g message-command-style "bg=#434548,fg=#a17eac,bold"

# Copy mode highlight
set -g mode-style "bg=#434548,fg=#e4b55e"

# Pane number display
set -g display-panes-colour        "#434548"
set -g display-panes-active-colour "#6e90b0"
