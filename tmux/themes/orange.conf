set -g @theme_bg_dim '#000000'
set -g @theme_bg0 '#000000'
set -g @theme_bg1 '#18181b'
set -g @theme_bg2 '#171717'
set -g @theme_bg3 '#1c1c1c'
set -g @theme_bg4 '#262626'
set -g @theme_bg5 '#343434'
set -g @theme_bg_pane '#0c0a09'
set -g @theme_fg '#ffffff'
set -g @theme_red '#ff0002'
set -g @theme_orange '#ff6820'
set -g @theme_sidebar_primary '#d45f10'
set -g @theme_grey1 '#a1a1a1'
set -g @theme_grey2 '#737373'
set -g @theme_statusline2 '#ffffff'
set -g @theme_statusline3 '#ff0002'

set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#ffffff'
set-option -g status-bg '#0c0a09'
set-option -g mode-style fg='#{@theme_grey1}',bg='#{@theme_sidebar_primary}'
set-option -g status-style fg='#{@theme_grey1}',bg='#{@theme_bg_pane}',default
set-window-option -g window-status-style fg='#{@theme_grey2}',bg='#{@theme_bg_pane}'
set-window-option -g window-status-activity-style fg='#{@theme_grey1}',bg='#{@theme_bg_pane}'
set-window-option -g window-status-current-style fg='#{@theme_orange}',bg='#{@theme_bg_pane}'
set-option -g pane-border-style fg='#{@theme_bg3}'
set-option -g pane-active-border-style fg='#{@theme_sidebar_primary}'
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#ffffff,bg=#{@theme_orange},bold] #S #[fg=#{@theme_grey1},bg=#{@theme_bg_pane},bold] #(whoami) '
set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@theme_grey1},bg=#{@theme_bg_pane}] %Y-%m-%d | %H:%M #[fg=#{@theme_orange},bg=#{@theme_bg_pane},bold] #h '
set -g window-status-separator ''
set -g window-status-format "#[fg=#{@theme_grey2},bg=#{@theme_bg_pane}] #I: #W "
set -g window-status-current-format "#[fg=#{@theme_orange},bg=#{@theme_bg_pane},bold] #I: #W "




