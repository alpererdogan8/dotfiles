# source-file ~/.config/tmux/themes/tmux-everforest-dark-hard.conf
source-file ~/.config/tmux/themes/sunset-drive.conf
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keys.conf




if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-plugins/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @tpm_plugins_shared_path '~/.config/tmux/plugins/'


run '~/.config/tmux/plugins/tpm/tpm'
