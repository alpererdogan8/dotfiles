[general]
import = [
    "~/.config/alacritty/themes/sunset-drive.toml"
]

[window]
opacity = 0.90
dynamic_title = true

[window.padding]
x = 8
y = 8

[font]
size = 12.0

[font.normal]
family = "IoskeleyMonoTerm  Nerd Font"
style = "SemiBold"

[font.bold]
family = "Ioskeley MonoTerm Nerd Font"
style = "ExtraBold"

[font.offset]
x = -1
y = 0

[cursor]
style = { shape = "Block", blinking = "Always" }

[selection]
save_to_clipboard = true

# [hints]
# [[hints.enabled]]
# command = "xdg-open"
# hyperlinks = true
# post_processing = true
# mouse.enabled = true
#

[env]
TERM = "alacritty"

[bell]
animation = "EaseOutExpo"
duration = 150
color = "#5c6675"
command = { program = "pw-play", args = ["/usr/share/sounds/freedesktop/stereo/dialog-warning.oga"] }
