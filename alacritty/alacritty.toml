[general]
import = [
    "~/.config/alacritty/themes/everforest-dark.toml"
]

[window]
opacity = 1
dynamic_title = true

[window.padding]
x = 8
y = 8

[font]
size = 12.0

[font.normal]
family = "Ioskeley Mono"
style = "Bold"

[font.bold]
family = "Ioskeley Mono"
style = "ExtraBold"

[font.offset]
x = -1
y = 0

[cursor]
style = { shape = "Block", blinking = "Always" }

[selection]
save_to_clipboard = true
